# sysmonitor configuration.
# Copy to thresholds.local.yaml to override locally without touching version control.

poll_interval_seconds: 5
top_n_processes: 5

thresholds:
  cpu_percent:    { warning: 70, critical: 90 }
  memory_percent: { warning: 70, critical: 90 }
  disk_percent:   { warning: 70, critical: 90 }

logging:
  log_file: logs/sysmonitor.log
  format: json   # "json" (one object per line) or "text" (human-readable)
