[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmonitor"
version = "0.1.0"
description = "System and per-process resource monitoring CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil==7.2.2",
    "click==8.5.0",
    "PyYAML==6.0.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[project.scripts]
sysmonitor = "sysmonitor.cli:cli"

[tool.setuptools]
packages = ["sysmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is reported on every run; the 100% gate lives on the full suite only
# (e.g. CI: `pytest --cov-fail-under=100`) so running a subset locally is fine.
addopts = "--cov=sysmonitor --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
