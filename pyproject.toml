[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmonitor"
version = "0.1.0"
description = "System and per-process resource monitoring CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil==7.2.2",
    "click==8.5.0",
    "PyYAML==6.0.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
sysmonitor = "sysmonitor.cli:cli"

[tool.setuptools]
packages = ["sysmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
